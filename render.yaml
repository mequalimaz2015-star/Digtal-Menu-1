services:
  - type: web
    name: digital-menu
    runtime: node
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        value: digital-menu-secret-key-2024-abc-restaurant
      - key: DB_SERVER
        sync: false
      - key: DB_NAME
        value: RestaurantDB
      - key: DB_USER
        value: menuapp
      - key: DB_PASS
        sync: false
