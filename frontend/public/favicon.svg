<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a2d5a"/>

  <!-- Tablet/device body -->
  <rect x="18" y="10" width="28" height="36" rx="4" ry="4" fill="#ffffff" opacity="0.95"/>
  <rect x="20" y="12" width="24" height="30" rx="2" ry="2" fill="#e8eef8"/>
  <!-- Home button -->
  <circle cx="32" cy="48" r="1.5" fill="#1a2d5a"/>

  <!-- Fork icon on tablet -->
  <line x1="27" y1="16" x2="27" y2="26" stroke="#1a2d5a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="16" x2="25" y2="19" stroke="#1a2d5a" stroke-width="1" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="27" y2="19" stroke="#1a2d5a" stroke-width="1" stroke-linecap="round"/>
  <line x1="29" y1="16" x2="29" y2="19" stroke="#1a2d5a" stroke-width="1" stroke-linecap="round"/>

  <!-- Menu lines on tablet -->
  <rect x="31" y="17" width="10" height="1.5" rx="0.75" fill="#1a2d5a" opacity="0.7"/>
  <rect x="31" y="20" width="8" height="1.5" rx="0.75" fill="#1a2d5a" opacity="0.7"/>
  <rect x="31" y="23" width="9" height="1.5" rx="0.75" fill="#1a2d5a" opacity="0.7"/>

  <!-- Cloche/dish dome -->
  <ellipse cx="32" cy="33" rx="7" ry="3.5" fill="#1a2d5a" opacity="0.85"/>
  <ellipse cx="32" cy="36" rx="8" ry="1.2" fill="#1a2d5a" opacity="0.6"/>

  <!-- Orange swoosh/orbit -->
  <path d="M14 28 Q20 10 38 18 Q50 24 46 38" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M18 36 Q22 50 40 46 Q52 42 50 30" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Orange dot accent (top right) -->
  <rect x="48" y="10" width="5" height="5" rx="1" fill="#f97316"/>
  <rect x="54" y="16" width="3" height="3" rx="0.5" fill="#f97316" opacity="0.7"/>
  <rect x="51" y="16" width="3" height="3" rx="0.5" fill="#f59e0b" opacity="0.5"/>
</svg>
